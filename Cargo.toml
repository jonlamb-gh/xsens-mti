[package]
name = "xsens-mti"
version = "0.7.0"
authors = ["Jon Lamb"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jonlamb-gh/xsens-mti"
description = "An unofficial and incomplete no_std Rust driver for Xsens MTi-series sensors."
documentation = "https://docs.rs/xsens-mti"
categories = ["no-std"]
keywords = ["xsens"]
resolver = "2"

[dependencies]
bitfield = "0.14"
byteorder = { version = "1.4", default-features = false }
defmt = { version = "1", optional = true }
static_assertions = { version = "1.1", default-features = false }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
approx = "0.5"
ctrlc = "3.4"
# Stuff for the examples
serial = "0.4"
pretty_assertions = "1.4"
proptest = { version = "1.2", default-features = false }

[features]
defmt = ["dep:defmt"]
